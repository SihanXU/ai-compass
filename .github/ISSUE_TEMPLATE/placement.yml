name: Dispute a placement or an entry
description: An ideology sits in the wrong cell, has the wrong shade, or its entry is unfair or wrong
labels: [placement]
body:
  - type: input
    id: entry
    attributes: { label: Entry, placeholder: "harness-liberalism" }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: What is wrong }
    validations: { required: true }
  - type: textarea
    id: fix
    attributes: { label: What it should be, description: The cell, level, wording or relation you propose, and why. }
