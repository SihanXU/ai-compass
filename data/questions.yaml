    text:
      en: Most of what a multimodal model knows about images comes from their paired captions, so caption quality matters more than image volume.
      zh: 多模态模型对图像的认识大多来自配对的描述文字，所以 caption 的质量比图像数量更重要。
  - id: k23
    effects:
