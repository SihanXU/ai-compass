      'y': arch
    text:
      en: Pretraining one model on interleaved image-text web documents matters more for multimodal ability than scaling paired image-caption data.
      zh: 对多模态能力来说，用图文交错的网页文档预训练一个模型，比扩大图文配对数据更重要。
